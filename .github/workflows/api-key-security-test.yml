name: API key secret cache security (Go)

on:
  push:
    branches:
      - master
    paths:
      - 'src/controller/admin/api_key_controller.go'
      - 'src/controller/admin/api_key_security_test.go'
      - '.github/workflows/api-key-security-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-key-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Verify secret cache response policy
        working-directory: src
        run: go test ./controller/admin -run '^TestSensitiveApiKeyResponsesNoStore$' -count=1 -v
