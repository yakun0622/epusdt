name: RPC credential serialization (Go)

on:
  push:
    branches:
      - master
    paths:
      - 'src/model/mdb/rpc_node.go'
      - 'src/model/mdb/rpc_node_security_test.go'
      - '.github/workflows/rpc-secret-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-serialization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Check RPC key cannot be serialized
        working-directory: src
        run: go test ./model/mdb -run '^TestRpcNodeJSONOmitsCredential$' -count=1 -v
