name: Web build verification

# Validate frontend changes on master, or run manually from the Actions tab.
on:
  push:
    branches:
      - master
      - 'feat/**'
    paths:
      - 'web/**'
      - '!web/package-lock.json'
      - '.github/workflows/web-build-manual.yml'
  workflow_dispatch:

# The only write action is committing web/package-lock.json after all checks pass.
permissions:
  contents: write

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-check:
    name: Typecheck, test and build web/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: web

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate lockfile if missing
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo 'Generating missing web/package-lock.json from package.json'
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Reproducible dependency installation
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Vite production build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          echo 'Build succeeded. Production src/www is unchanged.'

      - name: Commit lockfile after successful checks
        # Only master can receive an automated lockfile commit.
        # A GITHUB_TOKEN push will not recursively trigger this workflow.
        if: success() && github.ref == 'refs/heads/master'
        working-directory: .
        run: |
          git add -- web/package-lock.json
          if git diff --cached --quiet -- web/package-lock.json; then
            echo 'web/package-lock.json is already committed and unchanged.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(web): update npm dependency lockfile [skip ci]' -- web/package-lock.json
          # Fast-forward-only: refuse to overwrite later commits.
          git push origin HEAD:master

      - name: Summary
        if: success()
        run: |
          echo 'Web typecheck, tests and build passed.'
          echo 'Only web/package-lock.json may be committed automatically.'
          echo 'No deployment, no Docker build, no src/www synchronization.'
